name: Tests

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a test run (and spare ParaBank's rate limit)
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      groups:
        description: "JUnit tags to run (e.g. smoke, api, ui). Leave empty for all."
        required: false
        default: ""

# A new push cancels the run still in progress, so ParaBank is not hit twice at once
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # CI runs against its own ParaBank (official Docker image) instead of the shared public demo,
    # which rate-limits automated traffic (Cloudflare HTTP 429) and changes state between runs.
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8080:8080

    env:
      BASE_URL: http://localhost:8080/parabank/

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Playwright browser
        # Playwright is a test-scoped dependency, so exec:java needs the test classpath
        run: mvn -B -q test-compile exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Wait for ParaBank to start
        run: |
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null "${BASE_URL}index.htm"; then echo "ParaBank is up"; exit 0; fi
            sleep 5
          done
          echo "::error::ParaBank did not start within 5 minutes"; exit 1

      - name: Initialize the ParaBank database
        # Same as the "Initialize" button on ParaBank's admin page: loads the demo data
        run: curl -fs -o /dev/null -X POST "${BASE_URL}services/bank/initializeDB" || echo "::warning::Could not initialize the database"

      - name: Run tests
        env:
          # Chromium was installed in the previous step; skip Playwright's automatic download of every browser
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: mvn -B test -Dheadless=true -Dgroups="${{ github.event.inputs.groups }}"

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: target/playwright
          retention-days: 14
