# Application under test
baseUrl=https://parabank.parasoft.com/parabank/

# Browser: chromium | firefox | webkit
browser=chromium
headless=true
# Delay between actions in milliseconds (useful to watch a run locally)
slowMo=0
# Default timeout for actions and assertions, in milliseconds
timeout=15000

# Every value can be overridden from the command line, e.g.:
#   mvn test -Dheadless=false -Dbrowser=firefox
